[project]
name = "clear-backend"
version = "1.0.0"
description = "CLEAR: Clay-Court AI Referee Studio - Django Backend"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-cors-headers>=4.3,<5.0",
    "django-allauth>=0.61,<1.0",
    "dj-rest-auth>=6.0,<7.0",
    "channels>=4.0,<5.0",
    "channels-redis>=4.2,<5.0",
    "daphne>=4.1,<5.0",
    "psycopg2-binary>=2.9,<3.0",
    "opencv-python>=4.9,<5.0",
    "ultralytics>=8.1,<9.0",
    "numpy>=1.26,<2.0",
    "scipy>=1.12,<2.0",
    "scikit-image>=0.22,<1.0",
    "matplotlib>=3.8,<4.0",
    "torch>=2.1,<3.0",
    "torchvision>=0.16,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pillow>=10.2,<11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]

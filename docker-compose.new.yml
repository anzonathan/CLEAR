# CLEAR Consolidated Architecture
# Django + DRF Backend + Next.js Frontend

services:
  postgres:
    image: postgres:16-alpine
    container_name: clear-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clear
      POSTGRES_PASSWORD: clear_dev_password
      POSTGRES_DB: clear
    volumes:
      - clear_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clear -d clear"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clear-redis
    ports:
      - "6379:6379"
    volumes:
      - clear_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: clear-backend
    ports:
      - "8000:8000"
    environment:
      # Django settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}

      # Database
      POSTGRES_DB: clear
      POSTGRES_USER: clear
      POSTGRES_PASSWORD: clear_dev_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      # Redis for Channels
      REDIS_HOST: redis

      # CORS/CSRF
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8443}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8443}

      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # ML/CV Configuration
      CLEAR_DATA_DIR: /data
      CLEAR_RESULTS_DIR: /data/results
      CLEAR_CALIB_PATH: /data/calib/session.json
      CLEAR_YOLO_WEIGHTS: /app/models/yolov8n.pt
      CLEAR_DEVICE: ${CLEAR_DEVICE:-auto}
      CLEAR_FIELD_PASSWORD: ${CLEAR_FIELD_PASSWORD:-}
    volumes:
      - clear-data:/data
      - ./backend/media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/field/health/', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    shm_size: 1gb

  frontend:
    build: ./frontend
    container_name: clear-frontend
    ports:
      - "8443:3000"
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_WS_URL: ws://backend:8000
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: clear-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    profiles:
      - production

volumes:
  clear_postgres_data:
  clear_redis_data:
  clear-data:

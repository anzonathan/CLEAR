services:
  postgres:
    image: postgres:16-alpine
    container_name: clear-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clear
      POSTGRES_PASSWORD: clear_dev_password
      POSTGRES_DB: clear
    volumes:
      - clear_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clear -d clear"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth:
    build: ./auth-server
    container_name: clear-auth
    ports:
      - "3030:3030"
    environment:
      DATABASE_URL: postgres://clear:clear_dev_password@postgres:5432/clear
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-clear-auth-secret-change-in-production-2026}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3030}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:8443}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  clear-field:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clear-cv
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "${CLEAR_PORT:-8090}:8090"
    environment:
      CLEAR_DATA_DIR: /data
      CLEAR_RESULTS_DIR: /data/results
      CLEAR_CALIB_PATH: /data/calib/session.json
      CLEAR_YOLO_WEIGHTS: /app/models/yolov8n.pt
      CLEAR_DEVICE: ${CLEAR_DEVICE:-auto}
      CLEAR_YOLO_IMGSZ: ${CLEAR_YOLO_IMGSZ:-640}
      CLEAR_FIELD_TARGET_FPS: ${CLEAR_FIELD_TARGET_FPS:-15}
      CLEAR_FIELD_JPEG_QUALITY: ${CLEAR_FIELD_JPEG_QUALITY:-72}
      CLEAR_FIELD_MAX_WIDTH: ${CLEAR_FIELD_MAX_WIDTH:-960}
      CLEAR_DETECTOR_MODE: ${CLEAR_DETECTOR_MODE:-hybrid}
      CLEAR_COURT_SEG_WEIGHTS: ${CLEAR_COURT_SEG_WEIGHTS:-}
      CLEAR_FIELD_PASSWORD: ${CLEAR_FIELD_PASSWORD:-}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - clear-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=4)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 25s

  web:
    build: ./web
    container_name: clear-web
    ports:
      - "8443:80"
    depends_on:
      - auth
      - clear-field
    restart: unless-stopped

volumes:
  clear_postgres_data:
  clear-data:

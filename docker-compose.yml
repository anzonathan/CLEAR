# CLEAR Consolidated Architecture
# Django + DRF Backend + Next.js Frontend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clear
      POSTGRES_PASSWORD: clear_dev_password
      POSTGRES_DB: clear
    volumes:
      - clear_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clear -d clear"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - clear_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      # Django settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}

      # Database
      POSTGRES_DB: clear
      POSTGRES_USER: clear
      POSTGRES_PASSWORD: clear_dev_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      # Redis for Channels
      REDIS_HOST: redis

      # CORS/CSRF
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8443}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8443}

      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # ML/CV Configuration
      CLEAR_DATA_DIR: /data
      CLEAR_RESULTS_DIR: /data/results
      CLEAR_CALIB_PATH: /data/calib/session.json
      CLEAR_YOLO_WEIGHTS: /app/models/yolov8n.pt
      CLEAR_DEVICE: ${CLEAR_DEVICE:-cuda}
      CLEAR_FIELD_PASSWORD: ${CLEAR_FIELD_PASSWORD:-}
      CLEAR_DETECTOR_MODE: ${CLEAR_DETECTOR_MODE:-hybrid}
      CLEAR_YOLO_IMGSZ: ${CLEAR_YOLO_IMGSZ:-640}
      CLEAR_FIELD_TARGET_FPS: ${CLEAR_FIELD_TARGET_FPS:-15}
      CLEAR_COURT_SEG_WEIGHTS: ${CLEAR_COURT_SEG_WEIGHTS:-}

      # Email (console backend unless SMTP is configured)
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-CLEAR <noreply@clear.local>}
    volumes:
      - clear-data:/data
      - ./backend/media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/field/health/', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    shm_size: 1gb
    # NVIDIA GPU for detection. Needs nvidia-container-toolkit on the host.
    # CLEAR_GPU_ID picks the card (host index); the container sees it as cuda:0.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CLEAR_GPU_ID:-1}"]
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    expose:
      - "3000"
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_WS_URL: ws://backend:8000
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend
    restart: unless-stopped

  # Public entry point. In Coolify, attach the domain to this service on port 80.
  # No host ports here: they clash with Coolify (8000) and its proxy (80/443).
  proxy:
    build: ./proxy
    expose:
      - "80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  clear_postgres_data:
  clear_redis_data:
  clear-data:

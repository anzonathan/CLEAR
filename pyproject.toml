[project]
name = "clear-tennis"
version = "0.1.0"
description = "CLEAR: Clay-court Line Evaluation and Automated Refereeing (UCU Capstone)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
    "opencv-python>=4.9.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
yolo = [
    "ultralytics>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
